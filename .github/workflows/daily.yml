name: Build Daily Newspaper
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests feedparser ebooklib trafilatura
      - run: python build.py
      - run: |
          git config user.name "News Bot"
          git config user.email "bot@://github.com"
          git add docs/
          git commit -m "Update daily digest" || exit 0
          git push
